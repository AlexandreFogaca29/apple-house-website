<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de cadastro - Apple House Store</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="cadastro.css" />
  </head>

  <body class="bg-light d-flex flex-column min-vh-100">
    <header
      class="navbar navbar-expand-lg navbar-dark bg-black sticky-top py-3 shadow-sm"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 font-weight-bold"
          href="../../index.html"
        >
          <img
            src="../../assets/maca-aple.jpg.png"
            alt="Logo Apple"
            class="img-maca"
          />
          <span class="fw-semibold">Apple House Store</span>
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end mt-3 mt-lg-0"
          id="navbarNav"
        >
          <nav class="navbar-nav gap-2">
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="../../index.html"
              >HOME</a
            >
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="../login/login.html"
              >LOGIN</a
            >
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="./cadastro.html"
              >CADASTRO</a
            >
          </nav>
        </div>
      </div>
    </header>

    <main class="container my-auto py-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div
            class="border border-2 border-dark rounded-4 p-3 p-md-4 bg-white shadow-sm"
          >
            <form
              onsubmit="cadastrarUsuario(event)"
              class="border border-secondary-subtle rounded-4 p-4 p-md-5 bg-white"
            >
              <h2 class="h4 fw-bold text-dark text-center mb-4">
                Cadastro de clientes
              </h2>

              <div class="row g-3">
                <div class="col-12">
                  <label for="nome" class="form-label fw-semibold"
                    >Nome Completo</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="nome"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label for="email" class="form-label fw-semibold"
                    >Email</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    name="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label for="dataNascimento" class="form-label fw-semibold"
                    >Data de Nascimento</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    name="dataNascimento"
                    id="dataNascimento"
                    required
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label for="senha" class="form-label fw-semibold"
                    >Senha</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    name="senha"
                    id="senha"
                    placeholder="Crie uma senha"
                    required
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label for="confirmSenha" class="form-label fw-semibold"
                    >Confirme sua senha</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    name="confirmSenha"
                    id="confirmSenha"
                    placeholder="Confirme sua senha"
                    required
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label for="rg" class="form-label fw-semibold"
                    >RG (Registro Geral)</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="rg"
                    id="rg"
                    placeholder="00.000.000-0"
                    maxlength="12"
                    required
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label for="cpf" class="form-label fw-semibold">CPF</label>
                  <input
                    type="text"
                    class="form-control"
                    name="cpf"
                    id="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    required
                  />
                </div>

                <div class="col-12">
                  <label for="endereco" class="form-label fw-semibold"
                    >Endereço</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="endereco"
                    id="endereco"
                    placeholder="Digite seu endereço"
                    required
                  />
                </div>

                <div class="col-12 col-md-4">
                  <label for="cep" class="form-label fw-semibold">CEP</label>
                  <input
                    type="text"
                    class="form-control"
                    name="cep"
                    id="cep"
                    placeholder="00000-000"
                    maxlength="9"
                    required
                  />
                </div>

                <div class="col-12 col-md-8">
                  <label for="cidade" class="form-label fw-semibold"
                    >Cidade</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="cidade"
                    id="cidade"
                    placeholder="Digite a sua cidade"
                    required
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label for="estado" class="form-label fw-semibold"
                    >Estado</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    name="estado"
                    id="estado"
                    placeholder="Digite o seu estado"
                    required
                  />
                </div>

                <div class="col-12 col-md-6">
                  <label for="pais" class="form-label fw-semibold">País</label>
                  <input
                    type="text"
                    class="form-control"
                    name="pais"
                    id="pais"
                    placeholder="Digite o seu país"
                    required
                  />
                </div>
              </div>

              <button type="submit" class="btn btn-apple w-100 py-2 mt-4 mb-3">
                Finalizar Cadastro
              </button>

              <div
                class="d-flex justify-content-between align-items-center small"
              >
                <a
                  href="../../index.html"
                  class="text-primary text-decoration-none"
                  >Página Home</a
                >
                <a
                  href="../login/login.html"
                  class="text-primary text-decoration-none fw-semibold"
                  >Fazer Login</a
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
      <div class="container">
        <p class="small text-secondary mb-0">
          &copy; 2026 Apple House Store - Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="cadastro.js"></script>
  </body>
</html>
