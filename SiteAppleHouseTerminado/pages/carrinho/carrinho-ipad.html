<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho iPad Pro 13 - Apple House Store</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="carrinho-ipad.css" />
  </head>

  <body class="bg-light d-flex flex-column min-vh-100">
    <header
      class="navbar navbar-expand-lg navbar-dark bg-black sticky-top py-3 shadow-sm"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 font-weight-bold"
          href="../../index.html"
        >
          <img
            src="../../assets/maca-aple.jpg.png"
            alt="Logo Apple"
            class="img-maca"
          />
          <span class="fw-semibold">Apple House Store</span>
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end mt-3 mt-lg-0"
          id="navbarNav"
        >
          <nav class="navbar-nav gap-2">
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="../../index.html"
              >HOME</a
            >
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="../login/login.html"
              >LOGIN</a
            >
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="../cadastro/cadastro.html"
              >CADASTRO</a
            >
          </nav>
        </div>
      </div>
    </header>

    <main class="container my-auto py-5 flex-grow-1">
      <div
        class="border border-2 border-dark rounded-4 p-4 p-md-5 bg-white shadow-sm"
      >
        <h2 class="h3 fw-bold text-dark mb-4 pb-3 border-bottom">
          Seu Carrinho
        </h2>

        <div class="row g-4 align-items-stretch">
          <section class="col-12 col-lg-7">
            <article
              class="card border border-secondary-subtle rounded-4 p-4 shadow-sm h-100 justify-content-center bg-white"
            >
              <div class="row align-items-center g-3">
                <div class="col-4 col-sm-3 text-center">
                  <img
                    src="../../assets/tablet.jpg"
                    alt="iPad Pro 13"
                    class="img-fluid rounded-3"
                    style="max-height: 120px; object-fit: contain"
                  />
                </div>
                <div class="col-8 col-sm-9">
                  <h3 class="h5 fw-bold text-dark mb-2">iPad Pro 13</h3>
                  <p class="text-secondary fs-6 mb-0">
                    Preço unitário:
                    <span class="fw-semibold text-dark">R$ 13.999,00</span>
                  </p>
                </div>
              </div>
            </article>
          </section>

          <section class="col-12 col-lg-5">
            <div
              class="card border border-secondary-subtle rounded-4 p-4 shadow-sm bg-white h-100 d-flex flex-column justify-content-between"
            >
              <div>
                <h3 class="h5 fw-bold text-dark mb-3 pb-2 border-bottom">
                  Resumo da Compra
                </h3>

                <div
                  class="d-flex justify-content-between align-items-center mb-2"
                >
                  <span class="text-secondary">Subtotal:</span>
                  <span class="fw-semibold text-dark">R$ 13.999,00</span>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                >
                  <span class="text-secondary">Frete:</span>
                  <span class="text-success fw-semibold">Grátis</span>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center pt-2 border-top mb-4"
                >
                  <span class="fw-bold text-dark fs-5">Total:</span>
                  <strong class="text-dark fs-4">R$ 13.999,00</strong>
                </div>
              </div>

              <a
                href="../../index.html"
                class="btn btn-apple w-100 py-2 fs-6 mt-2"
                onclick="
                  alert(
                    'Compra realizada com sucesso, muito obrigado pela preferência!',
                  )
                "
              >
                Finalizar Compra
              </a>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
      <div class="container">
        <p class="small text-secondary mb-0">
          &copy; 2026 Apple House Store - Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
