<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci a Senha - Apple House Store</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="esqueci-senha.css" />
  </head>

  <body class="bg-light d-flex flex-column min-vh-100">
    <header
      class="navbar navbar-expand-lg navbar-dark bg-black sticky-top py-3 shadow-sm"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 font-weight-bold"
          href="../../index.html"
        >
          <img
            src="../../assets/maca-aple.jpg.png"
            alt="Logo Apple"
            class="img-maca"
          />
          <span class="fw-semibold">Apple House Store</span>
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end mt-3 mt-lg-0"
          id="navbarNav"
        >
          <nav class="navbar-nav gap-2">
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="../../index.html"
              >HOME</a
            >
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="../login/login.html"
              >LOGIN</a
            >
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="../cadastro/cadastro.html"
              >CADASTRO</a
            >
          </nav>
        </div>
      </div>
    </header>

    <main class="container my-auto py-5 flex-grow-1">
      <div
        class="row g-4 align-items-center justify-content-center border border-2 border-dark rounded-4 p-3 p-md-4 bg-white shadow-sm"
      >
        <section class="col-12 col-md-6">
          <figure class="text-center mb-0">
            <img
              class="img-fluid rounded-3 shadow-sm mb-2"
              src="../../assets/esqueci-senha.jpg"
              alt="imagem da assistencia apple"
              title="assistencia tecnica"
            />
            <figcaption class="text-muted small">
              Assistência da loja Apple House Store
            </figcaption>
          </figure>
        </section>

        <section class="col-12 col-md-6">
          <form
            id="form-recuperar"
            onsubmit="recuperarSenha(event)"
            class="border border-secondary-subtle rounded-4 p-4 p-md-5 bg-white"
          >
            <h2 class="h4 fw-bold text-dark mb-3">Recuperar Senha</h2>
            <p class="text-secondary small mb-4">
              Digite o e-mail cadastrado na sua conta para redefinir sua senha.
            </p>

            <div class="mb-4">
              <label for="email" class="form-label fw-semibold">Email</label>
              <input
                type="email"
                name="email"
                id="email"
                class="form-control form-control-lg"
                placeholder="Digite seu e-mail"
                required
              />
            </div>

            <button type="submit" class="btn btn-apple w-100 py-2 mb-3">
              Reenviar nova senha
            </button>

            <div
              class="d-flex justify-content-between align-items-center small"
            >
              <a
                href="../../index.html"
                class="text-primary text-decoration-none"
                >Página Home</a
              >
              <a
                href="../login/login.html"
                class="text-primary text-decoration-none fw-semibold"
                >Voltar ao Login</a
              >
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
      <div class="container">
        <p class="small text-secondary mb-0">
          &copy; 2026 Apple House Store - Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="esqueci-senha.js"></script>
  </body>
</html>
