<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple House Store</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <header
      class="navbar navbar-expand-lg navbar-dark bg-black sticky-top py-3 shadow-sm"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 font-weight-bold"
          href="index.html"
        >
          <img
            src="./assets/maca-aple.jpg.png"
            alt="Logo Apple"
            class="img-maca"
          />
          <span class="fw-semibold">Apple House Store</span>
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end mt-3 mt-lg-0"
          id="navbarNav"
        >
          <nav class="navbar-nav gap-2">
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="index.html"
              >HOME</a
            >
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="./pages/login/login.html"
              >LOGIN</a
            >
            <a
              class="nav-link btn btn-outline-light px-3 py-1 rounded-pill"
              href="./pages/cadastro/cadastro.html"
              >CADASTRO</a
            >
          </nav>
        </div>
      </div>
    </header>

    <main class="container my-5 flex-grow-1">
      <section class="row g-4 mb-5" id="vitrine-produtos"></section>

      <aside
        class="card bg-primary-subtle border-0 rounded-4 p-4 text-center shadow-sm"
      >
        <div class="card-body">
          <h3 class="h5 fw-bold text-primary-emphasis mb-2">
            <i class="bi bi-shield-check me-2"></i>Diferenciais Apple House
          </h3>
          <p class="card-text text-secondary mb-0">
            Garantia oficial de 1 ano, frete grátis para todo o Brasil e suporte
            técnico especializado.
          </p>
        </div>
      </aside>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
      <div class="container">
        <p class="small text-secondary mb-0">
          &copy; 2026 Apple House Store - Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="scripts.js"></script>
  </body>
</html>
